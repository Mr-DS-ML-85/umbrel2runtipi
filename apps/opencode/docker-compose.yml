services:
  app:
    image: ghcr.io/anomalyco/opencode:latest
    command:
    - serve
    - --hostname
    - 0.0.0.0
    - --port
    - '4096'
    restart: on-failure
    user: 1000:1000
    environment:
      HOME: /home/opencode
    volumes:
    - ${APP_DATA_DIR}/data/opencode:/home/opencode/
    x-runtipi:
      internal_port: 4096
      is_main: true
x-runtipi:
  schema_version: 2
