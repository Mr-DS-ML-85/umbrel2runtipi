services:
  backend:
    image: ghcr.io/kittendevv/invio-backend:latest
    environment:
      ADMIN_USER: admin
      ADMIN_PASS: ${APP_PASSWORD}
      JWT_SECRET: ${APP_SEED}
      SESSION_TTL_SECONDS: 43200
      SECURE_HEADERS_DISABLED: 'false'
      ENABLE_HSTS: 'true'
      DATABASE_PATH: /app/data/invio.db
    volumes:
    - ${APP_DATA_DIR}/data:/app/data
    restart: unless-stopped
    labels:
    - runtipi.managed=true
  frontend:
    image: ghcr.io/kittendevv/invio-frontend:latest
    environment:
      PORT: 8000
      BACKEND_URL: http://backend:3000
      COOKIE_SECURE: 'false'
      FRONTEND_SECURE_HEADERS_DISABLED: 'false'
      ENABLE_HSTS: 'false'
      ORIGIN: http://localhost:8003
    depends_on:
    - backend
    restart: unless-stopped
    labels:
    - runtipi.managed=true
    x-runtipi:
      internal_port: 8000
      is_main: true
x-runtipi:
  schema_version: 2
