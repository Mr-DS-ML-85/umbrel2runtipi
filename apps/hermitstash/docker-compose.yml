services:
  web:
    image: ghcr.io/dotcoocoo/hermitstash:latest
    user: 1000:1000
    init: true
    restart: on-failure
    stop_grace_period: 1m
    shm_size: 256m
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - require('http').get('http://localhost:3000/health',function(r){process.exit(r.statusCode===200?0:1)}).on('error',function(){process.exit(1)})
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    volumes:
    - ${APP_DATA_DIR}/data/db:/app/data
    - ${APP_DATA_DIR}/data/uploads:/app/uploads
    - ${APP_DATA_DIR}/data/custom:/app/public/img/custom
    environment:
      UMASK: '022'
      TZ: Etc/UTC
      NODE_ENV: production
      TRUST_PROXY: 'true'
      RP_ORIGIN: http://localhost:3081
      EMAIL_VERIFICATION: 'false'
    x-runtipi:
      internal_port: 3000
      is_main: true
x-runtipi:
  schema_version: 2
