services:
  web:
    image: ghcr.io/fccview/jotty:latest
    user: 1000:1000
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data/app:/app/data
    - ${APP_DATA_DIR}/data/config:/app/config
    - ${APP_DATA_DIR}/data/cache:/app/.next/cache
    environment:
    - NODE_ENV=production
    x-runtipi:
      internal_port: 3000
      is_main: true
x-runtipi:
  schema_version: 2
