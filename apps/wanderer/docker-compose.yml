services:
  web:
    image: flomp/wanderer-web:latest
    user: 1000:1000
    depends_on:
      search:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      ORIGIN: http://localhost:3111
      BODY_SIZE_LIMIT: Infinity
      PUBLIC_POCKETBASE_URL: http://wanderer_db_1:8090
      PUBLIC_DISABLE_SIGNUP: 'false'
      UPLOAD_FOLDER: /app/uploads
      UPLOAD_USER: admin
      UPLOAD_PASSWORD: ${APP_PASSWORD}
      VALHALLA_URL: https://valhalla1.openstreetmap.de
      NOMINATIM_URL: https://nominatim.openstreetmap.org
      OVERPASS_API_URL: https://overpass-api.de
      MEILI_URL: http://wanderer_search_1:7700
      MEILI_MASTER_KEY: ${APP_SEED}
    volumes:
    - ${APP_DATA_DIR}/data/uploads:/app/uploads
    restart: on-failure
    x-runtipi:
      internal_port: 3000
      is_main: true
  search:
    image: getmeili/meilisearch:latest
    environment:
      MEILI_NO_ANALYTICS: 'true'
      MEILI_URL: http://wanderer_search_1:7700
      MEILI_MASTER_KEY: ${APP_SEED}
    volumes:
    - ${APP_DATA_DIR}/data/data.ms:/meili_data/data.ms
    restart: on-failure
    healthcheck:
      test: curl --fail http://localhost:7700/health || exit 1
      interval: 15s
      retries: 10
      start_period: 20s
      timeout: 10s
  db:
    image: flomp/wanderer-db:latest
    user: 1000:1000
    depends_on:
      search:
        condition: service_healthy
    environment:
      POCKETBASE_ENCRYPTION_KEY: ${APP_WANDERER_ENCRYPTION_KEY}
      MEILI_URL: http://wanderer_search_1:7700
      MEILI_MASTER_KEY: ${APP_SEED}
      ORIGIN: http://localhost:3111
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data/pb_data:/pb_data
    - ${APP_DATA_DIR}/data/plugins:/data/plugins
    healthcheck:
      test:
      - CMD
      - /curl
      - --fail
      - http://localhost:8090/health
      interval: 15s
      retries: 10
      start_period: 20s
      timeout: 10s
x-runtipi:
  schema_version: 2
