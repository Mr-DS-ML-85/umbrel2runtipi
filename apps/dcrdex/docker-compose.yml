services:
  web:
    image: decred/dcrdex:v1.0.5
    restart: unless-stopped
    stop_grace_period: 15m
    volumes:
    - ${APP_DATA_DIR}/data:/dex/.dexc
    entrypoint:
    - /bin/sh
    - -c
    - exec ./bisonw --webaddr $(hostname -I|cut -d\  -f1 ):5758
    labels:
    - runtipi.managed=true
    x-runtipi:
      internal_port: 5758
      is_main: true
x-runtipi:
  schema_version: 2
