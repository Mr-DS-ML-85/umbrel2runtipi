services:
  app:
    image: ghcr.io/egzola/bitboard:1.0.0@sha256:810d296d9d4adb7757843bcfb6a21f115c2bd5bc54eebddc4a2b96b55bb6b326
    user: 1000:1000
    restart: unless-stopped
    stop_grace_period: 1m
    environment:
      PORT: 3711
    volumes:
    - ${APP_DATA_DIR}/data:/data
    labels:
    - runtipi.managed=true
    x-runtipi:
      internal_port: 3711
      is_main: true
x-runtipi:
  schema_version: 2
