services:
  server:
    image: docker.io/sipeed/picoclaw:v0.3.1-launcher@sha256:ed830c6cb71f59785062433159c45c2363465cd02046f8dd2822bd24a39510c2
    user: 1000:1000
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data:/data
    environment:
      PICOCLAW_HOME: /data
    labels:
    - runtipi.managed=true
    x-runtipi:
      internal_port: 18800
      is_main: true
x-runtipi:
  schema_version: 2
