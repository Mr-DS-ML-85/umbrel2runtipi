services:
  web:
    image: uusec/openresty-manager:2.4.5@sha256:0b00e240f05a1e9cf46a05efc9787b1b7c4eed39bf467962855bd0d300ead5dd
    hostname: web
    restart: unless-stopped
    ports:
    - 3080:80
    - 3443:443
    volumes:
    - /etc/localtime:/etc/localtime:ro
    - ${APP_DATA_DIR}/data/acme:/opt/om/acme
    - ${APP_DATA_DIR}/data/data:/opt/om/data
    - ${APP_DATA_DIR}/data/conf:/opt/om/nginx/conf
    - ${APP_DATA_DIR}/data/logs:/opt/om/nginx/logs
    environment:
    - OM_USE_HTTPS=no
    - NGINX_RESOLVER=resolver 127.0.0.11 valid=30s ipv6=off local=on;
    - PUID=1000
    - PGID=1000
    labels:
    - runtipi.managed=true
    x-runtipi:
      internal_port: 34567
      is_main: true
x-runtipi:
  schema_version: 2
