services:
  app:
    image: langflowai/langflow:1.11.3@sha256:bbb1376f6518f91a04eb3e1240b6388413546ff02aa2e9dbbc83f4ad71c8c771
    user: 1000:1000
    restart: unless-stopped
    environment:
      LANGFLOW_CONFIG_DIR: /app/langflow
      HOME: /app/langflow
      DO_NOT_TRACK: 'true'
      LANGFLOW_AUTO_LOGIN: 'true'
      LANGFLOW_SUPERUSER_PASSWORD: ${APP_PASSWORD}
      LANGFLOW_DATABASE_URL: postgresql://langflow:langflow@db:5432/langflow
    volumes:
    - ${APP_DATA_DIR}/data/app:/app/langflow
    labels:
    - runtipi.managed=true
    x-runtipi:
      internal_port: 7860
      is_main: true
  db:
    image: postgres:16.14-trixie@sha256:4b7183ac05f8ef417db21fd72d71047a4238340c261d3cc3ddb6d579ab5071ae
    user: 1000:1000
    restart: unless-stopped
    environment:
      POSTGRES_USER: langflow
      POSTGRES_PASSWORD: langflow
      POSTGRES_DB: langflow
    volumes:
    - ${APP_DATA_DIR}/data/db:/var/lib/postgresql/data
    labels:
    - runtipi.managed=true
x-runtipi:
  schema_version: 2
