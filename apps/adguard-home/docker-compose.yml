services:
  server:
    image: adguard/adguardhome:latest
    command:
    - --no-check-update
    - -c
    - /opt/adguardhome/conf/AdGuardHome.yaml
    - -w
    - /opt/adguardhome/work
    - --web-addr
    - 0.0.0.0:8095
    restart: on-failure
    network_mode: host
    volumes:
    - ${APP_DATA_DIR}/data/work:/opt/adguardhome/work
    - ${APP_DATA_DIR}/data/conf:/opt/adguardhome/conf
    cap_add:
    - NET_ADMIN
    x-runtipi:
      internal_port: 8095
      is_main: true
x-runtipi:
  schema_version: 2
