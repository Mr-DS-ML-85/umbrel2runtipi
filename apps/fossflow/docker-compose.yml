services:
  web:
    image: stnsmith/fossflow:latest
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/diagrams:/data/diagrams
    environment:
    - NODE_ENV=production
    - ENABLE_SERVER_STORAGE=true
    - STORAGE_PATH=/data/diagrams
    - ENABLE_GIT_BACKUP=false
    labels:
    - runtipi.managed=true
    x-runtipi:
      internal_port: 80
      is_main: true
x-runtipi:
  schema_version: 2
