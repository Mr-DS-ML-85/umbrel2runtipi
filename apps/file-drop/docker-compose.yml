services:
  app:
    image: ghcr.io/besoeasy/file-drop:latest
    user: 1000:1000
    restart: on-failure
    stop_grace_period: 5m
    environment:
    - NODE_ENV=production
    - IPFS_TELEMETRY=off
    volumes:
    - ${APP_DATA_DIR}/data:/data
    x-runtipi:
      internal_port: 3232
      is_main: true
x-runtipi:
  schema_version: 2
