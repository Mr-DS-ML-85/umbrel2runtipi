services:
  server:
    image: docuseal/docuseal:3.2.0@sha256:50ed54743542a86c7bb97bea06fbddae619cbd3273df9589af44cac318f0f774
    user: 1000:1000
    depends_on:
    - db
    restart: unless-stopped
    stop_grace_period: 1m
    environment:
      DATABASE_URL: postgresql://docusealuser:docusealpass@db:5432/docuseal?sslmode=disable
    volumes:
    - ${APP_DATA_DIR}/data/app:/data/docuseal
    labels:
    - runtipi.managed=true
    x-runtipi:
      internal_port: 3000
      is_main: true
  db:
    image: postgres:17.3@sha256:0321e2252ebfeecb8bc1a899755084d29bce872953e1a5a3e25ec0860b739098
    user: 1000:1000
    environment:
      POSTGRES_DB: docuseal
      POSTGRES_USER: docusealuser
      POSTGRES_PASSWORD: docusealpass
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/db:/var/lib/postgresql/data
    labels:
    - runtipi.managed=true
x-runtipi:
  schema_version: 2
