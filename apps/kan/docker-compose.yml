services:
  migrate:
    image: ghcr.io/kanbn/kan-migrate:latest
    environment:
      POSTGRES_URL: postgresql://kanuser:kanpassword@kan_db_1:5432/kan?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
  server:
    image: ghcr.io/kanbn/kan:latest
    environment:
      NEXT_PUBLIC_BASE_URL: http://localhost:8373
      BETTER_AUTH_SECRET: ${APP_SEED}
      POSTGRES_URL: postgresql://kanuser:kanpassword@kan_db_1:5432/kan?sslmode=disable
      NEXT_PUBLIC_ALLOW_CREDENTIALS: 'true'
    depends_on:
    - db
    restart: on-failure
    x-runtipi:
      internal_port: 3000
      is_main: true
  db:
    image: postgres:latest
    user: 1000:1000
    environment:
      POSTGRES_DB: kan
      POSTGRES_USER: kanuser
      POSTGRES_PASSWORD: kanpassword
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U kanuser -d kan
      interval: 5s
      timeout: 5s
      retries: 10
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data/db:/var/lib/postgresql/data
x-runtipi:
  schema_version: 2
