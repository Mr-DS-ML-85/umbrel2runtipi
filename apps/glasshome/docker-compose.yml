services:
  server:
    image: ghcr.io/glasshome/dash:latest
    restart: unless-stopped
    environment:
      PORT: 3123
      DATA_DIR: /data
    volumes:
    - ${APP_DATA_DIR}/data:/data
    labels:
    - runtipi.managed=true
    x-runtipi:
      internal_port: 3123
      is_main: true
x-runtipi:
  schema_version: 2
