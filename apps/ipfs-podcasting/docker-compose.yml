services:
  web:
    image: ipfspodcasting/podcastnode:v0.6
    init: true
    restart: on-failure
    stop_grace_period: 1m
    user: 1000:1000
    ports:
    - 4001:4001
    volumes:
    - ${APP_DATA_DIR}/ipfs:/ipfs-podcasting/ipfs
    - ${APP_DATA_DIR}/cfg:/ipfs-podcasting/cfg
    x-runtipi:
      internal_port: 8675
      is_main: true
x-runtipi:
  schema_version: 2
