services:
  server:
    image: ghcr.io/spacedriveapp/spacebot:latest
    user: 1000:1000
    restart: unless-stopped
    stop_grace_period: 1m
    volumes:
    - ${APP_DATA_DIR}/data:/data
    environment:
    - TZ=${TZ:-UTC}
    labels:
    - runtipi.managed=true
    x-runtipi:
      internal_port: 19898
      is_main: true
x-runtipi:
  schema_version: 2
