services:
  yucca:
    image: yuccastream/yucca:0.13.4@sha256:1304ad68fa866f2cf426d8c0bddf238cd2bbaeb3aeedd7a2b65eeafdd2b79917
    restart: unless-stopped
    shm_size: 128mb
    working_dir: /opt/yucca
    volumes:
    - ${APP_DATA_DIR}/data/data:/opt/yucca/data
    ports:
    - 10925:10925
    - 9912:9912
    environment:
      YUCCA_SERVER_DATA_DIR: /opt/yucca/data
      YUCCA_SMTP_SERVER_LISTEN_ADDRESS: :10925
    labels:
    - runtipi.managed=true
    x-runtipi:
      internal_port: 9910
      is_main: true
x-runtipi:
  schema_version: 2
