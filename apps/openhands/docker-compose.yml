services:
  docker:
    image: docker:latest
    privileged: true
    network_mode: host
    stop_grace_period: 1m
    restart: on-failure
    environment:
      DOCKER_ENSURE_BRIDGE: dind0:10.32.0.1/16
    entrypoint: /entrypoint.sh
    command: "dockerd\n  --bridge dind0\n  --data-root /data/data\n  --exec-root /data/exec\n  --host unix:///data/docker.sock\n  --iptables=false\n  --pidfile /data/docker.pid\n"
    volumes:
    - ${APP_DATA_DIR}/entrypoint.sh:/entrypoint.sh
    - ${APP_DATA_DIR}/data/docker:/data
  web:
    image: ghcr.io/openhands/openhands:latest
    depends_on:
      docker:
        condition: service_started
    stdin_open: true
    tty: true
    pull_policy: always
    healthcheck:
      test: timeout 10s bash -c ':> /dev/tcp/127.0.0.1/3000' || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    environment:
    - AGENT_SERVER_IMAGE_REPOSITORY=ghcr.io/openhands/agent-server
    - AGENT_SERVER_IMAGE_TAG=1.33.0-python
    - SANDBOX_HOST_PORT=3994
    - SANDBOX_CONTAINER_URL_PATTERN=http://localhost:{port}
    - WORKSPACE_MOUNT_PATH=/opt/workspace_base
    - LOG_ALL_EVENTS=true
    ports:
    - 10.32.0.1:3994:3000
    volumes:
    - ${APP_DATA_DIR}/data/docker:/var/run:rw
    - ${APP_DATA_DIR}/data/openhands:/.openhands:rw
    - ${APP_DATA_DIR}/data/workspace:/opt/workspace_base:rw
    extra_hosts:
    - host.docker.internal:host-gateway
    restart: on-failure
    x-runtipi:
      internal_port: 3000
      is_main: true
x-runtipi:
  schema_version: 2
