services:
  server:
    image: c4illin/convertx:latest
    restart: unless-stopped
    stop_grace_period: 1m
    user: 1000:1000
    environment:
    - HTTP_ALLOWED=true
    - ACCOUNT_REGISTRATION=true
    volumes:
    - ${APP_DATA_DIR}/data/app:/app/data
    labels:
    - runtipi.managed=true
    x-runtipi:
      internal_port: 3000
      is_main: true
x-runtipi:
  schema_version: 2
