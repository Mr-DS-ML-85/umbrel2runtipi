services:
  web:
    image: ghcr.io/9001/copyparty-ac:latest
    restart: unless-stopped
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/config/config.conf:/cfg/config.conf:ro
    - ${APP_DATA_DIR}/data/cp_data:/cfg/hists
    - ${APP_DATA_DIR}/data/shared:/shr
    - ${APP_DATA_DIR}/data/media:/media
    environment:
      TZ: UTC
    labels:
    - runtipi.managed=true
    x-runtipi:
      internal_port: 3923
      is_main: true
x-runtipi:
  schema_version: 2
