services:
  app:
    image: ghcr.io/timothepoznanski/poznote:6.57.1@sha256:cf03aa135db159ff31abf8b83a1e592c965d188b79e9175c060257e1bde1d46a
    restart: unless-stopped
    environment:
      SQLITE_DATABASE: /var/www/html/data/database/poznote.db
      HTTP_WEB_PORT: 80
    volumes:
    - ${APP_DATA_DIR}/data:/var/www/html/data
    healthcheck:
      test:
      - CMD
      - wget
      - --quiet
      - --tries=1
      - --timeout=5
      - -O
      - /dev/null
      - http://127.0.0.1/api/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
    - runtipi.managed=true
    x-runtipi:
      internal_port: 80
      is_main: true
  mcp:
    image: ghcr.io/timothepoznanski/poznote-mcp:6.57.1@sha256:0f1b990766fb9f937ad2b53c74c08776b367fefd6d6f05bc2aab990d25023f73
    restart: unless-stopped
    environment:
      POZNOTE_API_URL: http://app:80/api/v1
      POZNOTE_DEBUG: ${POZNOTE_DEBUG:-false}
    ports:
    - 8340:8045
    volumes:
    - ${APP_DATA_DIR}/data:/var/www/html/data:ro
    depends_on:
    - app
    labels:
    - runtipi.managed=true
x-runtipi:
  schema_version: 2
