services:
  app:
    image: ghcr.io/peerloomllc/pearcircle-seeder:1.1.0
    restart: unless-stopped
    stop_grace_period: 1m
    security_opt:
    - no-new-privileges:true
    environment:
      SEEDER_HOST: 0.0.0.0
      SEEDER_PORT: '8730'
      SEEDER_NO_AUTH: '1'
      SEEDER_NO_UPDATE_CHECK: '1'
    volumes:
    - ${APP_DATA_DIR}/data:/data
    labels:
    - runtipi.managed=true
    x-runtipi:
      internal_port: 8730
      is_main: true
x-runtipi:
  schema_version: 2
