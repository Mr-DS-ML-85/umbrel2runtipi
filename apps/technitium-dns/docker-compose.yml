services:
  dns-server:
    image: technitium/dns-server:latest
    network_mode: host
    environment:
    - DNS_SERVER_DOMAIN=localhost
    - DNS_SERVER_ADMIN_PASSWORD=${APP_PASSWORD}
    volumes:
    - ${APP_DATA_DIR}/data:/etc/dns
    restart: unless-stopped
    labels:
    - runtipi.managed=true
    x-runtipi:
      internal_port: 5380
      is_main: true
x-runtipi:
  schema_version: 2
