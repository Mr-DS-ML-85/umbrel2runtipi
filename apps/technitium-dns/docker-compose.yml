services:
  dns-server:
    image: technitium/dns-server:15.4.0@sha256:df7d90ef0f7b6fff6916d291a7022cd902290cc31c3141d4158b6c375a641b41
    network_mode: host
    environment:
    - DNS_SERVER_DOMAIN=localhost
    - DNS_SERVER_ADMIN_PASSWORD=${APP_PASSWORD}
    volumes:
    - ${APP_DATA_DIR}/data:/etc/dns
    restart: unless-stopped
    labels:
    - runtipi.managed=true
    x-runtipi:
      internal_port: 5380
      is_main: true
x-runtipi:
  schema_version: 2
