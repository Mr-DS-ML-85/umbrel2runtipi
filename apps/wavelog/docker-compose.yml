services:
  app:
    image: ghcr.io/wavelog/wavelog:latest
    environment:
      CI_ENV: docker
    volumes:
    - ${APP_DATA_DIR}/data/config:/var/www/html/application/config/docker
    - ${APP_DATA_DIR}/data/uploads:/var/www/html/uploads
    - ${APP_DATA_DIR}/data/userdata:/var/www/html/userdata
    depends_on:
    - wavelog-db
    labels:
    - runtipi.managed=true
    restart: unless-stopped
    x-runtipi:
      internal_port: 80
      is_main: true
  wavelog-db:
    image: mariadb:latest
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: true
      MARIADB_DATABASE: wavelog
      MARIADB_USER: wavelog
      MARIADB_PASSWORD: wavelog
    volumes:
    - ${APP_DATA_DIR}/data/db:/var/lib/mysql
    labels:
    - runtipi.managed=true
    restart: unless-stopped
x-runtipi:
  schema_version: 2
