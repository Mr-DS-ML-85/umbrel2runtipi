services:
  app:
    image: appsmith/appsmith-ce:latest
    environment:
      APPSMITH_ENCRYPTION_PASSWORD: ${APP_PASSWORD}
      APPSMITH_ENCRYPTION_SALT: ${APP_PASSWORD}
    volumes:
    - ${APP_DATA_DIR}/data/app:/appsmith-stacks
    x-runtipi:
      internal_port: 80
      is_main: true
x-runtipi:
  schema_version: 2
