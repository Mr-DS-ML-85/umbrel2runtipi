services:
  server:
    image: linuxserver/remmina:1.4.35@sha256:ca2b6788bad28d864086649fc276ce696cac9cdf69e6976b85497b341ed07d8d
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    labels:
    - runtipi.managed=true
    x-runtipi:
      internal_port: 3000
      is_main: true
x-runtipi:
  schema_version: 2
