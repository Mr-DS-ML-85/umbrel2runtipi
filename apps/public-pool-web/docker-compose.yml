services:
  rails-app:
    image: martinbarilik/public-pool-web:latest
    restart: on-failure
    user: 1000:1000
    environment:
    - RAILS_MASTER_KEY=${APP_PUBLIC_POOL_WEB_MASTER_KEY}
    - DATABASE_URL=${APP_PUBLIC_POOL_WEB_DATABASE_URL}
    - REDIS_URL=${APP_PUBLIC_POOL_WEB_REDIS_URL}
    - PUBLIC_POOL_HOST=public-pool_server_1
    - PUBLIC_POOL_PORT=2019
    - DONATE_BTC_ADDRESS=bc1qsn9x9vr9alx33687dqq9rt4cgfcldsrxz90pn4
    - DONATE_LN_ADDRESS=martinbarilik@getalby.com
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    x-runtipi:
      internal_port: 3000
      is_main: true
  db:
    image: pgautoupgrade/pgautoupgrade:latest
    restart: on-failure
    environment:
    - POSTGRES_USER=${APP_PUBLIC_POOL_WEB_POSTGRES_USERNAME}
    - POSTGRES_PASSWORD=${APP_PUBLIC_POOL_WEB_POSTGRES_PASSWORD}
    - POSTGRES_DB=${APP_PUBLIC_POOL_WEB_POSTGRES_DBNAME}
    volumes:
    - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql
    healthcheck:
      test:
      - CMD-SHELL
      - test ! -f /var/lib/postgresql/PG_VERSION && test ! -f $${PGDATA}/upgrade_in_progress.lock && pg_isready -U ${APP_PUBLIC_POOL_WEB_POSTGRES_USERNAME} -d ${APP_PUBLIC_POOL_WEB_POSTGRES_DBNAME}
      start_period: 30m
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: valkey/valkey:latest
    restart: on-failure
    user: 1000:1000
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli ping
      interval: 10s
      timeout: 5s
      retries: 5
  sidekiq:
    image: martinbarilik/public-pool-web:latest
    restart: on-failure
    user: 1000:1000
    environment:
    - RAILS_MASTER_KEY=${APP_PUBLIC_POOL_WEB_MASTER_KEY}
    - REDIS_URL=${APP_PUBLIC_POOL_WEB_REDIS_URL}
    - DATABASE_URL=${APP_PUBLIC_POOL_WEB_DATABASE_URL}
    - PUBLIC_POOL_HOST=public-pool_server_1
    - PUBLIC_POOL_PORT=2019
    command: bundle exec sidekiq
    depends_on:
    - redis
    - db
    - rails-app
x-runtipi:
  schema_version: 2
