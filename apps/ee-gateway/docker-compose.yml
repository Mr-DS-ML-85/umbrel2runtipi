services:
  init_perms:
    image: encryptedenergy/ee-gateway-worker:0.8.0@sha256:816e236ff47052e5d081cc4a99f56c40434df33aba1b0efd0badc4d30902ae04
    user: 0:0
    entrypoint:
    - sh
    - -c
    - chown -R 1000:1000 /data
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data:/data
    labels:
    - runtipi.managed=true
  ui:
    image: encryptedenergy/ee-gateway-ui:0.6.4@sha256:c30e4b2a2bd640005499e4fe564a04f6650b920c0726b15e2437eaa41ffb25eb
    init: true
    restart: unless-stopped
    depends_on:
      init_perms:
        condition: service_completed_successfully
    volumes:
    - ${APP_DATA_DIR}/data:/data
    environment:
      EE_DATA_DIR: /data
      EE_UI_PORT: 8080
      EE_GATEWAY_VERSION: 0.10.7
    labels:
    - runtipi.managed=true
    x-runtipi:
      internal_port: 8080
      is_main: true
  worker:
    image: encryptedenergy/ee-gateway-worker:0.8.0@sha256:816e236ff47052e5d081cc4a99f56c40434df33aba1b0efd0badc4d30902ae04
    init: true
    restart: unless-stopped
    depends_on:
      init_perms:
        condition: service_completed_successfully
    network_mode: host
    cap_add:
    - NET_ADMIN
    - NET_RAW
    device_cgroup_rules:
    - c 188:* rwm
    - c 166:* rwm
    volumes:
    - ${APP_DATA_DIR}/data:/data
    - /var/run/dbus:/var/run/dbus:ro
    - /dev:/dev
    environment:
      EE_DATA_DIR: /data
    labels:
    - runtipi.managed=true
x-runtipi:
  schema_version: 2
