services:
  docker:
    image: docker:latest
    privileged: true
    network_mode: host
    stop_grace_period: 1m
    restart: unless-stopped
    environment:
      DOCKER_ENSURE_BRIDGE: dind0:10.32.0.1/16
    entrypoint: /entrypoint.sh
    command: "dockerd\n  --bridge dind0\n  --data-root /data/data\n  --exec-root /data/exec\n  --host unix:///data/docker.sock\n  --pidfile /data/docker.pid\n"
    volumes:
    - ${APP_DATA_DIR}/entrypoint.sh:/entrypoint.sh
    - ${APP_DATA_DIR}/data/docker:/data
    labels:
    - runtipi.managed=true
  postgres:
    image: ghcr.io/ferretdb/postgres-documentdb:latest
    labels:
      komodo.skip: null
      runtipi.managed: true
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: postgres
  ferretdb:
    image: ghcr.io/ferretdb/ferretdb:latest
    labels:
      komodo.skip: null
      runtipi.managed: true
    restart: unless-stopped
    depends_on:
    - postgres
    volumes:
    - ${APP_DATA_DIR}/data/ferretdb:/state
    environment:
      FERRETDB_POSTGRESQL_URL: postgres://admin:admin@postgres:5432/postgres
  core:
    image: ghcr.io/moghtech/komodo-core:latest
    init: true
    labels:
      komodo.skip: null
      runtipi.managed: true
    restart: unless-stopped
    depends_on:
    - ferretdb
    environment:
      KOMODO_DATABASE_ADDRESS: ferretdb:27017
      KOMODO_DATABASE_USERNAME: admin
      KOMODO_DATABASE_PASSWORD: admin
      KOMODO_PASSKEY: ${APP_PASSWORD}
      KOMODO_FIRST_SERVER: https://periphery:8120
      KOMODO_JWT_SECRET: ${APP_SEED}
    volumes:
    - ${APP_DATA_DIR}/data/core:/backups
    - ${APP_DATA_DIR}/data/keys:/config/keys
    x-runtipi:
      internal_port: 9120
      is_main: true
  periphery:
    image: ghcr.io/moghtech/komodo-periphery:latest
    labels:
      komodo.skip: null
      runtipi.managed: true
    restart: unless-stopped
    environment:
      COMPOSE_KOMODO_IMAGE_TAG: latest
      KOMODO_PASSKEY: ${APP_PASSWORD}
      TZ: Europe/Berlin
      PERIPHERY_ROOT_DIRECTORY: /etc/komodo
      PERIPHERY_PASSKEYS: ${APP_PASSWORD}
      PERIPHERY_DISABLE_TERMINALS: 'false'
      PERIPHERY_SSL_ENABLED: 'true'
      PERIPHERY_INCLUDE_DISK_MOUNTS: /etc/hostname
      PERIPHERY_LOGGING_PRETTY: 'false'
      PERIPHERY_PRETTY_STARTUP_CONFIG: 'false'
    volumes:
    - ${APP_DATA_DIR}/data/docker:/var/run
    - /proc:/proc
    - ${APP_DATA_DIR}/data/periphery:/etc/komodo
x-runtipi:
  schema_version: 2
