services:
  web:
    image: ghcr.io/gamosoft/notediscovery:latest
    user: 1000:1000
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data:/app/data
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 60s
      timeout: 3s
      retries: 3
      start_period: 5s
    x-runtipi:
      internal_port: 8000
      is_main: true
x-runtipi:
  schema_version: 2
