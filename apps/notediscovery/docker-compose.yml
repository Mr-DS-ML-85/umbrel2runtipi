services:
  web:
    image: ghcr.io/gamosoft/notediscovery:0.31.0@sha256:6df44b5866ff875f637a8a600300c023953054b732217ca0c490593575a03688
    user: 1000:1000
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data:/app/data
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 60s
      timeout: 3s
      retries: 3
      start_period: 5s
    labels:
    - runtipi.managed=true
    x-runtipi:
      internal_port: 8000
      is_main: true
x-runtipi:
  schema_version: 2
