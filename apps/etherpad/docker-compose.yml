services:
  app:
    image: etherpad/etherpad:latest
    volumes:
    - ${APP_DATA_DIR}/data/plugins:/opt/etherpad-lite/src/plugin_packages
    - ${APP_DATA_DIR}/data/etherpad-var:/opt/etherpad-lite/var:rw
    depends_on:
    - postgres
    environment:
      NODE_ENV: production
      CI: 'true'
      ADMIN_PASSWORD: ${APP_PASSWORD}
      DB_CHARSET: utf8mb4
      DB_HOST: postgres
      DB_NAME: etherpad
      DB_PASS: admin
      DB_PORT: 5432
      DB_TYPE: postgres
      DB_USER: admin
      DEFAULT_PAD_TEXT: null
      DISABLE_IP_LOGGING: 'false'
      LOGLEVEL: INFO
      SOFFICE: null
      ALLOW_UNKNOWN_FILE_ENDS: 'true'
      TRUST_PROXY: 'true'
      SKIN_NAME: colibris
      SKIN_VARIANTS: super-light-toolbar super-light-editor light-background
      SHOW_SETTINGS_IN_ADMIN_PAGE: 'true'
      SUPPRESS_ERRORS_IN_PAD_TEXT: 'false'
    restart: unless-stopped
    user: '5001:0'
    labels:
    - runtipi.managed=true
    x-runtipi:
      internal_port: 9001
      is_main: true
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: etherpad
      POSTGRES_PASSWORD: admin
      POSTGRES_PORT: 5432
      POSTGRES_USER: admin
      PGDATA: /var/lib/postgresql/data/pgdata
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/postgres_data:/var/lib/postgresql/data/pgdata
    labels:
    - runtipi.managed=true
x-runtipi:
  schema_version: 2
