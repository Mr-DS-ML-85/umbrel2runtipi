services:
  web:
    image: dumbwareio/dumbpad:latest
    user: 1000:1000
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data:/app/data
    environment:
      SITE_TITLE: DumbPad
      BASE_URL: http://localhost:3000
    labels:
    - runtipi.managed=true
    x-runtipi:
      internal_port: 3000
      is_main: true
x-runtipi:
  schema_version: 2
