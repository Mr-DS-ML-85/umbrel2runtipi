services:
  web:
    image: ghcr.io/fuzzygrim/yamtrack:latest
    restart: on-failure
    security_opt:
    - no-new-privileges:true
    depends_on:
    - redis
    environment:
      SECRET: ${APP_SEED}
      REDIS_URL: redis://yamtrack_redis_1:6379
    volumes:
    - ${APP_DATA_DIR}/data/db:/yamtrack/db:rw
    x-runtipi:
      internal_port: 8000
      is_main: true
  redis:
    image: redis:latest
    user: 1000:1000
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data/redis:/data:rw
x-runtipi:
  schema_version: 2
