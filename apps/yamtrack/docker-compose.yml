services:
  web:
    image: ghcr.io/fuzzygrim/yamtrack:0.26.1@sha256:2c4c8ef6b73ba00aeb3e7cda5a34751f01448034a23d2fbcc98e48e44d377bb8
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    depends_on:
    - redis
    environment:
      SECRET: ${APP_SEED}
      REDIS_URL: redis://redis:6379
    volumes:
    - ${APP_DATA_DIR}/data/db:/yamtrack/db:rw
    labels:
    - runtipi.managed=true
    x-runtipi:
      internal_port: 8000
      is_main: true
  redis:
    image: redis:8.0.2@sha256:b43d2dcbbdb1f9e1582e3a0f37e53bf79038522ccffb56a25858969d7a9b6c11
    user: 1000:1000
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/redis:/data:rw
    labels:
    - runtipi.managed=true
x-runtipi:
  schema_version: 2
