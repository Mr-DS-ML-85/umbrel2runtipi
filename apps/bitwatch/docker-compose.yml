services:
  web:
    image: ghcr.io/zapomatic/bitwatch:latest
    restart: unless-stopped
    stop_grace_period: 1m
    volumes:
    - ${APP_DATA_DIR}/data:/app/server/data
    labels:
    - runtipi.managed=true
    x-runtipi:
      internal_port: 3117
      is_main: true
x-runtipi:
  schema_version: 2
