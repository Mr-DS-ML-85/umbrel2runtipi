services:
  server:
    image: ghcr.io/thomiceli/opengist:1.15.1@sha256:038d47937d3ba4b49ec28a76d3966383e0a46acf7ee1f19b1bae4ac0758c694c
    user: 1000:1000
    restart: unless-stopped
    ports:
    - 2224:2224
    volumes:
    - ${APP_DATA_DIR}/data:/opengist
    environment:
      OG_SSH_PORT: '2224'
    labels:
    - runtipi.managed=true
    x-runtipi:
      internal_port: 6157
      is_main: true
x-runtipi:
  schema_version: 2
