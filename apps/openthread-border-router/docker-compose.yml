services:
  setup:
    image: python:latest
    network_mode: host
    restart: on-failure
    stop_grace_period: 10s
    environment:
      SETUP_PORT: '7586'
      OTBR_WEB_PORT: '7587'
      OTBR_REST_PORT: '8083'
    volumes:
    - ${APP_DATA_DIR}/server.py:/app/server.py:ro
    - ${APP_DATA_DIR}/data:/data
    - /dev:/dev:ro
    command:
    - python3
    - /app/server.py
  server:
    image: ghcr.io/ownbee/hass-otbr-docker:latest
    network_mode: host
    privileged: true
    restart: on-failure
    stop_grace_period: 1m
    depends_on:
    - setup
    environment:
      OTBR_WEB_PORT: '7587'
      OTBR_REST_PORT: '8083'
    volumes:
    - ${APP_DATA_DIR}/data:/data
    - /dev:/dev
    entrypoint:
    - /bin/bash
    - -c
    - "set -uo pipefail\nSETTINGS=/data/settings.env\nload_settings() {\n  CONFIGURED=0; DEVICE=\"\"; BAUDRATE=\"\"; FLOW_CONTROL=\"\"; BACKBONE_IF=\"\"\n  FIREWALL=\"\"; NAT64=\"\"; AUTOFLASH_FIRMWARE=\"\"\n  [ -f \"$$SETTINGS\" ] || return\n  while IFS='=' read -r key val; do\n    case \"$$key\" in\n      DEVICE|BAUDRATE|FLOW_CONTROL|BACKBONE_IF|FIREWALL|NAT64|AUTOFLASH_FIRMWARE|CONFIGURED)\n        export \"$$key=$$val\" ;;\n    esac\n  done < \"$$SETTINGS\"\n}\necho \"[otbr] waiting for first-run setup to complete (open the app to configure)...\"\nwhile true; do\n  load_settings\n  if [ \"$${CONFIGURED:-0}\" = \"1\" ] && [ -n \"$${DEVICE:-}\" ] && [ -e \"$${DEVICE:-/nonexistent}\" ]; then\n    break\n  fi\n  echo \"[otbr] not configured yet — retrying in 5s\"\n  sleep 5\ndone\necho \"[otbr] configured (DEVICE=$$DEVICE BACKBONE_IF=$${BACKBONE_IF:-}) — starting border router\"\n# Record the settings we are launching with so the wizard can tell when\n# the live border router matches the saved config (vs. a pending restart).\ncat \"$$SETTINGS\" > /data/.applied 2>/dev/null || true\nfind / -type f -name app.js -path '*frontend/res/js/*' 2>/dev/null \\\n  | xargs -r sed -i \"s/restServerPort = '8081'/restServerPort = '$${OTBR_REST_PORT:-8081}'/\"\n# s6-overlay must run as PID 1, so exec it. A background watcher restarts\n# the container when settings change: it asks s6 to shut down with a\n# non-zero exit code (via s6's container-results file), which restart:\n# on-failure then brings back up to re-read the new settings. A normal\n# Umbrel stop exits 0, so it is not restarted.\n(\n  ref=\"$$(cat \"$$SETTINGS\" 2>/dev/null)\"\n  while sleep 5; do\n    if [ \"$$(cat \"$$SETTINGS\" 2>/dev/null)\" != \"$$ref\" ]; then\n      echo \"[otbr] settings changed — restarting to apply\"\n      echo 1 > /run/s6-linux-init-container-results/exitcode 2>/dev/null || true\n      kill -TERM 1 2>/dev/null || true\n      exit 0\n    fi\n  done\n) &\nexec /init\n"
    x-runtipi:
      internal_port: 7586
      is_main: true
x-runtipi:
  schema_version: 2
