services:
  api_web:
    image: toshimoto821/toshi-moto-api:1.8.4
    restart: on-failure
    stop_grace_period: 1m
    user: 1000:1000
    depends_on:
    - mongodb
    environment:
      PORT: 8121
      MONGODB_URI: mongodb://toshi-moto_mongodb_1:27017/toshi-moto
  web:
    image: toshimoto821/toshi-moto:1.37.3
    restart: on-failure
    user: 1000:1000
    stop_grace_period: 1m
    volumes:
    - ${APP_DATA_DIR}/data/proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
    - api_web
    environment:
      PORT: 8021
    x-runtipi:
      internal_port: 8021
      is_main: true
  mongodb:
    image: mongo:latest
    stop_grace_period: 1m
    user: 1000:1000
    command: mongod --noauth
    volumes:
    - ${APP_DATA_DIR}/data/db:/data/db
x-runtipi:
  schema_version: 2
