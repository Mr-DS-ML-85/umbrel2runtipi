services:
  web:
    image: tombursch/kitchenowl:v0.7.10@sha256:bd821a41b8cb27fd7fcf429acd1fc67e9f889485a2cd1193d68c2d804a8e1bef
    user: 1000:1000
    restart: unless-stopped
    environment:
      JWT_SECRET_KEY: ${APP_PASSWORD}
      DB_DRIVER: postgresql
      DB_HOST: db
      DB_NAME: kitchenowl
      DB_USER: kitchenowl
      DB_PASSWORD: password
    volumes:
    - ${APP_DATA_DIR}/data/kitchenowl_files:/data
    depends_on:
    - db
    labels:
    - runtipi.managed=true
    x-runtipi:
      internal_port: 8080
      is_main: true
  db:
    image: postgres:17.4@sha256:fe3f571d128e8efadcd8b2fde0e2b73ebab6dbec33f6bfe69d98c682c7d8f7bd
    user: 1000:1000
    restart: unless-stopped
    environment:
      POSTGRES_DB: kitchenowl
      POSTGRES_USER: kitchenowl
      POSTGRES_PASSWORD: password
    volumes:
    - ${APP_DATA_DIR}/data/kitchenowl_db:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s
    labels:
    - runtipi.managed=true
x-runtipi:
  schema_version: 2
