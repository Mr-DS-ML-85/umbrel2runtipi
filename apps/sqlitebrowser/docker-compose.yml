services:
  app:
    image: linuxserver/sqlitebrowser:3.13.1@sha256:1b1e81f0af222af3353a4c8d3c4737264a1816a43e4410819430335fa099b1da
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/CET
    labels:
    - runtipi.managed=true
    x-runtipi:
      internal_port: 3000
      is_main: true
x-runtipi:
  schema_version: 2
