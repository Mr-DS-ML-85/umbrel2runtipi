services:
  docker:
    image: docker:latest
    privileged: true
    network_mode: host
    stop_grace_period: 1m
    restart: unless-stopped
    environment:
      DOCKER_ENSURE_BRIDGE: dind0:10.32.0.1/16
    entrypoint: /entrypoint.sh
    command: "dockerd\n  --bridge dind0\n  --data-root /data/data\n  --exec-root /data/exec\n  --host unix:///data/docker.sock\n  --pidfile /data/docker.pid\n"
    volumes:
    - ${APP_DATA_DIR}/entrypoint.sh:/entrypoint.sh
    - ${APP_DATA_DIR}/data/docker:/data
    labels:
    - runtipi.managed=true
  arcane:
    image: ghcr.io/getarcaneapp/arcane:latest
    depends_on:
    - docker
    restart: unless-stopped
    environment:
      APP_URL: ${APP_PROTOCOL:-http}://${APP_DOMAIN}
      PUID: 1000
      PGID: 1000
      ENCRYPTION_KEY: ${APP_PASSWORD}
      JWT_SECRET: ${APP_PASSWORD}
    volumes:
    - ${APP_DATA_DIR}/data/app_data:/app/data
    - ${APP_DATA_DIR}/data/projects:/app/data/projects
    - ${APP_DATA_DIR}/data/docker:/var/run
    labels:
    - runtipi.managed=true
    x-runtipi:
      internal_port: 3552
      is_main: true
x-runtipi:
  schema_version: 2
