services:
  app:
    image: ghcr.io/muchobien/pocketbase:0.39.10@sha256:dfebd2550d6b5176d67afd3e859f9b642096e624c7f6ada1b5a5bc70a5d21be1
    restart: unless-stopped
    stop_grace_period: 1m
    volumes:
    - ${APP_DATA_DIR}/data/data:/pb_data
    - ${APP_DATA_DIR}/data/public:/pb_public
    - ${APP_DATA_DIR}/data/hooks:/pb_hooks
    - ${APP_DATA_DIR}/data/migrations:/pb_migrations
    labels:
    - runtipi.managed=true
    x-runtipi:
      internal_port: 8090
      is_main: true
x-runtipi:
  schema_version: 2
