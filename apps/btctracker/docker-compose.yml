services:
  web:
    image: thewilqq/btc-tracker:latest
    restart: on-failure
    user: 1000:1000
    environment:
    - NODE_ENV=production
    - PORT=3000
    - DATABASE_URL=file:/app/data/bitcoin-tracker.db
    - NEXTAUTH_SECRET=${APP_SEED}
    - NEXTAUTH_URL=http://localhost:3947
    volumes:
    - ${APP_DATA_DIR}/data:/app/data
    x-runtipi:
      internal_port: 3000
      is_main: true
x-runtipi:
  schema_version: 2
