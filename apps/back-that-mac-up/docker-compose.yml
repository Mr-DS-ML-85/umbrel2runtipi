services:
  server:
    image: getumbrel/umbrel-back-that-mac-up:1.0.1
    restart: on-failure
    environment:
      TIME_MACHINE_DIR: /timemachine
    volumes:
    - ${APP_DATA_DIR}/data:/timemachine
    x-runtipi:
      internal_port: 80
      is_main: true
  timemachine:
    image: mbentley/timemachine:latest
    hostname: umbrel
    environment:
      ADVERTISED_HOSTNAME: umbrel
      CUSTOM_SMB_CONF: 'false'
      CUSTOM_USER: 'false'
      DEBUG_LEVEL: '1'
      HIDE_SHARES: 'no'
      EXTERNAL_CONF: ''
      MIMIC_MODEL: TimeCapsule8,119
      TM_USERNAME: timemachine
      TM_GROUPNAME: timemachine
      TM_UID: '1000'
      TM_GID: '1000'
      PASSWORD: timemachine
      SET_PERMISSIONS: 'false'
      SHARE_NAME: Umbrel - Time Machine
      SMB_INHERIT_PERMISSIONS: 'no'
      SMB_NFS_ACES: 'no'
      SMB_METADATA: stream
      SMB_PORT: '445'
      SMB_VFS_OBJECTS: acl_xattr fruit streams_xattr
      VOLUME_SIZE_LIMIT: '0'
      WORKGROUP: WORKGROUP
    restart: unless-stopped
    ports:
    - 137:137/udp
    - 138:138/udp
    - 139:139
    - 445:445
    volumes:
    - ${APP_DATA_DIR}/data/opt-timemachine:/opt/timemachine
    - ${APP_DATA_DIR}/data/var-lib-samba:/var/lib/samba
    - ${APP_DATA_DIR}/data/var-cache-samba:/var/cache/samba
    - ${APP_DATA_DIR}/data/run-samba:/run/samba
x-runtipi:
  schema_version: 2
