services:
  web:
    image: ghcr.io/satoshi-dashboard/main:latest
    user: 1000:1000
    restart: on-failure
    stop_grace_period: 1m
    environment:
      SERVE_STATIC: 'true'
      API_PORT: 8410
      API_HOST: 0.0.0.0
    volumes:
    - ${APP_DATA_DIR}/data:/app/server/.runtime-cache
    x-runtipi:
      internal_port: 8410
      is_main: true
x-runtipi:
  schema_version: 2
