services:
  web:
    image: getumbrel/umbrel-nostr-relay:latest
    user: 1000:1000
    restart: unless-stopped
    environment:
      RELAY_HOST: relay
      RELAY_PORT: '8080'
      RELAY_PROXY_HOST: relay-proxy
      RELAY_PROXY_PORT: '80'
    labels:
    - runtipi.managed=true
    x-runtipi:
      internal_port: 3000
      is_main: true
  relay:
    image: getumbrel/nostr-rs-relay:0.8.1
    user: 1000:1000
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/relay/config.toml:/app/config.toml
    - ${APP_DATA_DIR}/data/relay/db:/app/db
    labels:
    - runtipi.managed=true
  relay-proxy:
    image: getumbrel/umbrel-nostr-relay-proxy:v1.1.0
    user: 1000:1000
    restart: unless-stopped
    environment:
      RELAY_HOST: relay
      RELAY_PORT: '8080'
    volumes:
    - ${APP_DATA_DIR}/data/relay-proxy:/app/data
    depends_on:
    - relay
    labels:
    - runtipi.managed=true
x-runtipi:
  schema_version: 2
