services:
  app:
    image: ghcr.io/besoeasy/originless:0.1.0@sha256:f4f232052e2763eb23bd9019da885f5700fae947b8760a695be6774bfc9c38b9
    user: 1000:1000
    restart: unless-stopped
    stop_grace_period: 5m
    ports:
    - 4003:4001/tcp
    - 4003:4001/udp
    volumes:
    - ${APP_DATA_DIR}/data:/data
    environment:
    - NODE_ENV=production
    - STORAGE_MAX=${STORAGE_MAX:-20GB}
    labels:
    - runtipi.managed=true
    x-runtipi:
      internal_port: 3232
      is_main: true
x-runtipi:
  schema_version: 2
