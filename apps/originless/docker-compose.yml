services:
  app:
    image: ghcr.io/besoeasy/originless:latest
    user: 1000:1000
    restart: on-failure
    stop_grace_period: 5m
    ports:
    - 4003:4001/tcp
    - 4003:4001/udp
    volumes:
    - ${APP_DATA_DIR}/data:/data
    environment:
    - NODE_ENV=production
    - STORAGE_MAX=${STORAGE_MAX:-20GB}
    x-runtipi:
      internal_port: 3232
      is_main: true
x-runtipi:
  schema_version: 2
