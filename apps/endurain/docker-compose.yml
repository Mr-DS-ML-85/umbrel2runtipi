services:
  app:
    image: ghcr.io/endurain-project/endurain:latest
    environment:
      UID: '1000'
      GID: '1000'
      DB_TYPE: postgres
      DB_HOST: endurain_db_1
      DB_PORT: 5432
      DB_PASSWORD: endurain
      SECRET_KEY: ${APP_PASSWORD}
      BEHIND_PROXY: 'true'
    volumes:
    - ${APP_DATA_DIR}/data/app:/app/backend/data
    - ${APP_DATA_DIR}/data/logs:/app/backend/logs
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    x-runtipi:
      internal_port: 8080
      is_main: true
  db:
    image: postgres:latest
    user: 1000:1000
    environment:
      POSTGRES_PASSWORD: endurain
      POSTGRES_DB: endurain
      POSTGRES_USER: endurain
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
    - ${APP_DATA_DIR}/data/db:/var/lib/postgresql/data
    restart: on-failure
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U endurain
      interval: 5s
      timeout: 5s
      retries: 5
x-runtipi:
  schema_version: 2
