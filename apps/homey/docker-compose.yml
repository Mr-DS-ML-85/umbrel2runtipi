services:
  web:
    image: ghcr.io/athombv/homey-shs:latest
    restart: unless-stopped
    network_mode: host
    privileged: true
    volumes:
    - ${APP_DATA_DIR}/data:/homey/user
    labels:
    - runtipi.managed=true
    x-runtipi:
      internal_port: 4859
      is_main: true
x-runtipi:
  schema_version: 2
