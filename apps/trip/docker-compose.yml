services:
  app:
    image: ghcr.io/itskovacs/trip:1.47.0@sha256:4094594c95a66fd89892ecc2f483b027691631cc50a47a0744397816a5e7ce82
    restart: unless-stopped
    stop_grace_period: 1m
    volumes:
    - ${APP_DATA_DIR}/data/app:/app/storage
    command:
    - fastapi
    - run
    - /app/trip/main.py
    - --host
    - 0.0.0.0
    labels:
    - runtipi.managed=true
    x-runtipi:
      internal_port: 8000
      is_main: true
x-runtipi:
  schema_version: 2
