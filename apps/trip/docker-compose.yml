services:
  app:
    image: ghcr.io/itskovacs/trip:latest
    restart: on-failure
    stop_grace_period: 1m
    volumes:
    - ${APP_DATA_DIR}/data/app:/app/storage
    command:
    - fastapi
    - run
    - /app/trip/main.py
    - --host
    - 0.0.0.0
    x-runtipi:
      internal_port: 8000
      is_main: true
x-runtipi:
  schema_version: 2
