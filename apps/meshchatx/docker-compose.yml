services:
  web:
    image: ghcr.io/quad4-software/meshchatx:4.6.0-rc.4
    restart: unless-stopped
    user: 1000:1000
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/status')
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    volumes:
    - ${APP_DATA_DIR}/data:/config
    environment:
      MESHCHAT_NO_HTTPS: 'true'
    labels:
    - runtipi.managed=true
    x-runtipi:
      internal_port: 8000
      is_main: true
x-runtipi:
  schema_version: 2
