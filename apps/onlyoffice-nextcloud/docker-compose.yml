services:
  web:
    image: a4004/onlyoffice-nextcloud-web:1.0.4
    restart: on-failure
    environment:
    - DOCS_ADDRESS=http://localhost:$DOCSERVER_PORT
    - DOCS_INTERNAL_ADDRESS=http://onlyoffice-nextcloud_documentserver_1
    - NEXTCLOUD_INTERNAL_ADDRESS=http://nextcloud_web_1
    - NEXTCLOUD_WEB_URL=http://localhost:$APP_NEXTCLOUD_PORT
    x-runtipi:
      internal_port: 3000
      is_main: true
  documentserver:
    image: onlyoffice/documentserver:latest
    restart: on-failure
    stop_grace_period: 1m
    ports:
    - ${DOCSERVER_PORT}:80
    environment:
    - JWT_ENABLED=false
    - ONLYOFFICE_HTTPS_HSTS_ENABLED=false
    - USE_UNAUTHORIZED_STORAGE=true
    - ALLOW_PRIVATE_IP_ADDRESS=true
    - ALLOW_META_IP_ADDRESS=true
    volumes:
    - ${APP_DATA_DIR}/data/logs:/var/log/onlyoffice
    - ${APP_DATA_DIR}/data/certs:/var/www/onlyoffice/Data
    - ${APP_DATA_DIR}/data/cache:/var/lib/onlyoffice
    - ${APP_DATA_DIR}/data/db:/var/lib/postgresql
x-runtipi:
  schema_version: 2
