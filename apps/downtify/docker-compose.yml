services:
  downtify:
    image: ghcr.io/henriquesebastiao/downtify:latest
    stop_grace_period: 1m
    volumes:
    - ${RUNTIPI_MEDIA_DIR}/downloads/downtify:/downloads
    - ${APP_DATA_DIR}/data:/data
    labels:
    - runtipi.managed=true
    restart: unless-stopped
    x-runtipi:
      internal_port: 8000
      is_main: true
x-runtipi:
  schema_version: 2
