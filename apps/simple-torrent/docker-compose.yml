services:
  server:
    image: boypt/cloud-torrent:1.3.9@sha256:90cc62869ebaabbdba31535cdff4c66ede98b341956d2ebcd6650610a37e9819
    user: 1000:1000
    restart: unless-stopped
    command: '--port=8086 --config-path /config/simple-torrent.json

      '
    volumes:
    - ${APP_DATA_DIR}/data/torrents:/torrents
    - ${RUNTIPI_MEDIA_DIR}/downloads/:/downloads
    - ${APP_DATA_DIR}/data/config:/config
    labels:
    - runtipi.managed=true
    x-runtipi:
      internal_port: 8086
      is_main: true
x-runtipi:
  schema_version: 2
