services:
  db:
    image: mariadb:latest
    user: 1000:1000
    environment:
      MYSQL_ROOT_PASSWORD: tyooe
      MYSQL_DATABASE: pastefy
      MYSQL_USER: pastefy
      MYSQL_PASSWORD: tyooe
    volumes:
    - ${APP_DATA_DIR}/data/db:/var/lib/mysql:rw
    restart: unless-stopped
    labels:
    - runtipi.managed=true
  app:
    image: interaapps/pastefy:latest
    user: 1000:1000
    environment:
      HTTP_SERVER_CORS: '*'
      DATABASE_DRIVER: mysql
      DATABASE_NAME: pastefy
      DATABASE_USER: pastefy
      DATABASE_PASSWORD: tyooe
      DATABASE_HOST: db
      DATABASE_PORT: '3306'
      SERVER_NAME: ${APP_PROTOCOL:-http}://${APP_DOMAIN}
    restart: unless-stopped
    depends_on:
    - db
    labels:
    - runtipi.managed=true
    x-runtipi:
      internal_port: 80
      is_main: true
x-runtipi:
  schema_version: 2
