services:
  db:
    image: mariadb:latest
    user: 1000:1000
    environment:
      MYSQL_ROOT_PASSWORD: tyooe
      MYSQL_DATABASE: pastefy
      MYSQL_USER: pastefy
      MYSQL_PASSWORD: tyooe
    volumes:
    - ${APP_DATA_DIR}/data/db:/var/lib/mysql:rw
    restart: on-failure
  app:
    image: interaapps/pastefy:latest
    user: 1000:1000
    environment:
      HTTP_SERVER_CORS: '*'
      DATABASE_DRIVER: mysql
      DATABASE_NAME: pastefy
      DATABASE_USER: pastefy
      DATABASE_PASSWORD: tyooe
      DATABASE_HOST: pastefy_db_1
      DATABASE_PORT: '3306'
      SERVER_NAME: http://localhost:9900
    restart: on-failure
    depends_on:
    - db
    x-runtipi:
      internal_port: 80
      is_main: true
x-runtipi:
  schema_version: 2
