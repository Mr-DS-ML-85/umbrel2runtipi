services:
  web:
    image: linuxserver/pyload-ng:latest
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${RUNTIPI_MEDIA_DIR}/downloads/:/downloads
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    x-runtipi:
      internal_port: 8000
      is_main: true
x-runtipi:
  schema_version: 2
