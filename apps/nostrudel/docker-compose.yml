services:
  cors:
    image: ghcr.io/hzrd149/docker-cors-anywhere:latest
    environment:
      CORSANYWHERE_REQUIRE_HEADERS: host
  web:
    image: ghcr.io/hzrd149/nostrudel:latest
    restart: on-failure
    stop_grace_period: 1m
    init: true
    depends_on:
    - cors
    environment:
      REQUEST_PROXY: cors:8080
    x-runtipi:
      internal_port: 80
      is_main: true
x-runtipi:
  schema_version: 2
