services:
  web:
    image: ghcr.io/getumbrel/hermes-agent-umbrel:v2026.8.13
    restart: unless-stopped
    stop_grace_period: 1m
    volumes:
    - ${APP_DATA_DIR}/data/hermes:/opt/data
    environment:
      HERMES_UID: '1000'
      HERMES_GID: '1000'
      HERMES_DASHBOARD: '1'
      HERMES_DASHBOARD_PORT: '18789'
      HERMES_UMBREL_APP_PROXY_AUTH: '1'
      HERMES_TUI_DIR: /app/umbrel-tui
      HERMES_UPSTREAM_TUI_ENTRY: /opt/hermes/ui-tui/dist/entry.js
      HERMES_GATEWAY_BOOTSTRAP_STATE: running
    command:
    - gateway
    - run
    labels:
    - runtipi.managed=true
    x-runtipi:
      internal_port: 18789
      is_main: true
x-runtipi:
  schema_version: 2
