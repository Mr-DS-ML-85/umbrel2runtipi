services:
  hbbs:
    image: rustdesk/rustdesk-server:latest
    ports:
    - 21115:21115
    - 21116:21116
    - 21116:21116/udp
    - 21118:21118
    command: hbbs
    volumes:
    - ${APP_DATA_DIR}/data/hbbs:/root
    network_mode: host
    depends_on:
    - hbbr
    restart: unless-stopped
    labels:
    - runtipi.managed=true
  hbbr:
    image: rustdesk/rustdesk-server:latest
    ports:
    - 21117:21117
    - 21119:21119
    command: hbbr
    volumes:
    - ${APP_DATA_DIR}/data/hbbr:/root
    network_mode: host
    restart: unless-stopped
    labels:
    - runtipi.managed=true
  web:
    image: nginx:latest
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/www:/usr/share/nginx/html:ro
    labels:
    - runtipi.managed=true
    x-runtipi:
      internal_port: 80
      is_main: true
x-runtipi:
  schema_version: 2
