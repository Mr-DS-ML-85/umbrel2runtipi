services:
  app:
    image: ghcr.io/itskovacs/wingfit:latest
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data:/app/storage
    command:
    - fastapi
    - run
    - /app/wingfit/main.py
    - --host
    - 0.0.0.0
    x-runtipi:
      internal_port: 8000
      is_main: true
x-runtipi:
  schema_version: 2
