services:
  app:
    image: ghcr.io/itskovacs/wingfit:5.3.1@sha256:fed5dcc1c8abdec6409f4272caa08f9a6f1d2a3c8e1f9a13b3459c2ffea8a360
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data:/app/storage
    command:
    - fastapi
    - run
    - /app/wingfit/main.py
    - --host
    - 0.0.0.0
    labels:
    - runtipi.managed=true
    x-runtipi:
      internal_port: 8000
      is_main: true
x-runtipi:
  schema_version: 2
