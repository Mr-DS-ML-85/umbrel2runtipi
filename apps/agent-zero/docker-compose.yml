services:
  web:
    image: agent0ai/agent-zero:latest
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    extra_hosts:
    - host.docker.internal:host-gateway
    volumes:
    - ${APP_DATA_DIR}/data/usr:/a0/usr
    environment:
    - ALLOWED_ORIGINS=${APP_PROTOCOL:-http}://${APP_DOMAIN}:${APP_AGENTZERO_PORT},${APP_PROTOCOL:-http}://${APP_DOMAIN}:${APP_AGENTZERO_PORT},${APP_AGENTZERO_LOCAL_URLS}
    labels:
    - runtipi.managed=true
    x-runtipi:
      internal_port: 80
      is_main: true
x-runtipi:
  schema_version: 2
