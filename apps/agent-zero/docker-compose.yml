services:
  web:
    image: agent0ai/agent-zero:latest
    restart: on-failure
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    extra_hosts:
    - host.docker.internal:host-gateway
    volumes:
    - ${APP_DATA_DIR}/data/usr:/a0/usr
    environment:
    - ALLOWED_ORIGINS=http://localhost:${APP_AGENTZERO_PORT},http://localhost:${APP_AGENTZERO_PORT},${APP_AGENTZERO_LOCAL_URLS}
    x-runtipi:
      internal_port: 80
      is_main: true
x-runtipi:
  schema_version: 2
