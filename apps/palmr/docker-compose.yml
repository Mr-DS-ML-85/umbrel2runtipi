services:
  server:
    image: kyantech/palmr:v3.3.2-beta@sha256:043dd6cdbb4d9985b376915020fb26c2037b19876674273eac310ab04cdf16f4
    restart: unless-stopped
    stop_grace_period: 1m
    environment:
      PALMR_UID: 1000
      PALMR_GID: 1000
    volumes:
    - ${APP_DATA_DIR}/data:/app/server
    labels:
    - runtipi.managed=true
    x-runtipi:
      internal_port: 5487
      is_main: true
x-runtipi:
  schema_version: 2
