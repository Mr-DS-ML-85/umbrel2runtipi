services:
  web:
    image: voidic/dtan-server:latest
    restart: unless-stopped
    environment:
    - RUST_LOG=info
    volumes:
    - ${APP_DATA_DIR}/data/app:/app/data
    - ${APP_DATA_DIR}/data/config/config.yml:/app/config.yml
    labels:
    - runtipi.managed=true
    x-runtipi:
      internal_port: 8000
      is_main: true
x-runtipi:
  schema_version: 2
