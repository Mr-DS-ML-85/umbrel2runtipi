services:
  manager:
    image: mopfelwinrux/urbit-umbrel:latest
    ports:
    - 34343:34343
    volumes:
    - ${APP_DATA_DIR}/piers:/data/piers
    - ${APP_DATA_DIR}/keys:/data/keys
    environment:
      APP_PASSWORD: ${APP_PASSWORD}
    labels:
    - runtipi.managed=true
    restart: unless-stopped
    x-runtipi:
      internal_port: 8090
      is_main: true
x-runtipi:
  schema_version: 2
