services:
  db:
    image: postgres:17.3@sha256:6e3358e46e34dae6c184f48fd06fe1b3dbf958ad5b83480031907e52b9ec2a7d
    healthcheck:
      test:
      - CMD
      - pg_isready
      - -q
      - -d
      - blinko
      - -U
      - blinkouser
      timeout: 45s
      interval: 10s
      retries: 10
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/db:/var/lib/postgresql/data:rw
    environment:
      POSTGRES_DB: blinko
      POSTGRES_USER: blinkouser
      POSTGRES_PASSWORD: blinkopass
    restart: unless-stopped
    labels:
    - runtipi.managed=true
  app:
    image: blinkospace/blinko:1.8.8@sha256:31c3bc9f4fc00c82328c098c0c1120fe7fe43152a9f3cbc04b0303c32a2e60d3
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:1111
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      NODE_ENV: production
      NEXTAUTH_URL: http://localhost:1111
      NEXT_PUBLIC_BASE_URL: http://localhost:1111
      NEXTAUTH_SECRET: ${APP_SEED}
      DATABASE_URL: postgresql://blinkouser:blinkopass@db:5432/blinko
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/app:/app/.blinko:rw
    logging:
      options:
        max-size: 10m
        max-file: '3'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    labels:
    - runtipi.managed=true
    x-runtipi:
      internal_port: 1111
      is_main: true
x-runtipi:
  schema_version: 2
