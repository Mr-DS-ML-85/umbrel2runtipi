services:
  db:
    image: postgres:latest
    healthcheck:
      test:
      - CMD
      - pg_isready
      - -q
      - -d
      - blinko
      - -U
      - blinkouser
      timeout: 45s
      interval: 10s
      retries: 10
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/db:/var/lib/postgresql/data:rw
    environment:
      POSTGRES_DB: blinko
      POSTGRES_USER: blinkouser
      POSTGRES_PASSWORD: blinkopass
    restart: on-failure
  app:
    image: blinkospace/blinko:latest
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:1111
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      NODE_ENV: production
      NEXTAUTH_URL: http://localhost:1111
      NEXT_PUBLIC_BASE_URL: http://localhost:1111
      NEXTAUTH_SECRET: ${APP_SEED}
      DATABASE_URL: postgresql://blinkouser:blinkopass@blinko_db_1:5432/blinko
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/app:/app/.blinko:rw
    logging:
      options:
        max-size: 10m
        max-file: '3'
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    x-runtipi:
      internal_port: 1111
      is_main: true
x-runtipi:
  schema_version: 2
