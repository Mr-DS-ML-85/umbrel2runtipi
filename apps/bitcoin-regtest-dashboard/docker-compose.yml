services:
  bitcoin:
    image: ghcr.io/getumbrel/docker-bitcoind:v31.0
    user: 1000:1000
    restart: on-failure
    entrypoint:
    - /bin/sh
    - -c
    command:
    - "rm -f /data/.bitcoin/regtest/.ready\nbitcoind -regtest \\\n  -server=1 \\\n  -rpcbind=0.0.0.0 \\\n  -rpcallowip=0.0.0.0/0 \\\n  -rpcport=18443 \\\n  -txindex=1 \\\n  -fallbackfee=0.00001 \\\n  -disablewallet=0 \\\n  -zmqpubrawblock=tcp://0.0.0.0:28332 \\\n  -zmqpubrawtx=tcp://0.0.0.0:28333 &\nBITCOIND_PID=$$!\nwhile [ ! -f /data/.bitcoin/regtest/.cookie ]; do sleep 1; done\nchmod 755 /data/.bitcoin/regtest\nchmod 644 /data/.bitcoin/regtest/.cookie\nsleep 2\nbitcoin-cli -regtest -rpccookiefile=/data/.bitcoin/regtest/.cookie createwallet \"regtest_wallet\" 2>/dev/null || \\\n  bitcoin-cli -regtest -rpccookiefile=/data/.bitcoin/regtest/.cookie loadwallet \"regtest_wallet\" 2>/dev/null || true\nbitcoin-cli -regtest -rpccookiefile=/data/.bitcoin/regtest/.cookie -rpcwallet=regtest_wallet -generate 1 >/dev/null 2>&1 || true\ntouch /data/.bitcoin/regtest/.ready\nwhile kill -0 $$BITCOIND_PID 2>/dev/null; do\n  chmod 755 /data/.bitcoin/regtest 2>/dev/null\n  chmod 644 /data/.bitcoin/regtest/.cookie 2>/dev/null\n  sleep 5\ndone &\nwait $$BITCOIND_PID\n"
    volumes:
    - ${APP_DATA_DIR}/data/bitcoin:/data/.bitcoin
    healthcheck:
      test:
      - CMD-SHELL
      - test -f /data/.bitcoin/regtest/.ready && chmod 644 /data/.bitcoin/regtest/.cookie && bitcoin-cli -regtest -rpccookiefile=/data/.bitcoin/regtest/.cookie getblockchaininfo
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  electrs:
    image: getumbrel/electrs:latest
    user: 1000:1000
    restart: on-failure
    ports:
    - 60401:50001
    environment:
      ELECTRS_ELECTRUM_RPC_ADDR: 0.0.0.0:50001
      ELECTRS_DAEMON_RPC_ADDR: bitcoin-regtest-dashboard_bitcoin_1:18443
      ELECTRS_DAEMON_P2P_ADDR: bitcoin-regtest-dashboard_bitcoin_1:18444
      ELECTRS_LOG_FILTERS: INFO
      ELECTRS_NETWORK: regtest
    volumes:
    - ${APP_DATA_DIR}/data/electrs:/data
    - ${APP_DATA_DIR}/data/bitcoin:/data/.bitcoin:ro
    depends_on:
      bitcoin:
        condition: service_healthy
  dashboard:
    image: coreylphillips/bitcoin-regtest-dashboard:v1.0.4
    user: 1000:1000
    restart: on-failure
    environment:
      PORT: 3000
      BITCOIN_RPC_HOST: bitcoin-regtest-dashboard_bitcoin_1
      BITCOIN_RPC_PORT: 18443
      BITCOIN_COOKIE_FILE: /bitcoin/.bitcoin/regtest/.cookie
      ELECTRS_HOST: bitcoin-regtest-dashboard_electrs_1
      ELECTRS_PORT: 50001
      ELECTRS_EXTERNAL_PORT: 60401
    volumes:
    - ${APP_DATA_DIR}/data/bitcoin:/bitcoin/.bitcoin:ro
    depends_on:
      bitcoin:
        condition: service_healthy
    x-runtipi:
      internal_port: 3000
      is_main: true
x-runtipi:
  schema_version: 2
