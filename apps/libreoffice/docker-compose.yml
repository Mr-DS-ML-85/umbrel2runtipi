services:
  server:
    image: linuxserver/libreoffice:latest
    restart: on-failure
    stop_grace_period: 1m
    environment:
    - PUID=1000
    - PGID=1000
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    x-runtipi:
      internal_port: 3000
      is_main: true
x-runtipi:
  schema_version: 2
