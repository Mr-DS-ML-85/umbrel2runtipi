services:
  web:
    image: ksjaay/lunalytics:0.10.23@sha256:b1e44f9e647e3e240400eafc914facafbfad2cc87d6c4f02d823226dd9731511
    user: 1000:1000
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - nc -z 127.0.0.1 2308 || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    volumes:
    - ${APP_DATA_DIR}/data/lunalytics_data:/app/data:rw
    - ${APP_DATA_DIR}/data/logs:/app/logs:rw
    labels:
    - runtipi.managed=true
    x-runtipi:
      internal_port: 2308
      is_main: true
x-runtipi:
  schema_version: 2
