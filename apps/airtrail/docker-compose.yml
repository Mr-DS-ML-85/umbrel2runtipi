services:
  app:
    image: johly/airtrail:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      UPLOAD_LOCATION: /app/uploads
      DB_URL: postgres://airtrail:itworkslocally@postgres:5432/airtrail
    volumes:
    - ${APP_DATA_DIR}/data/uploads:/app/uploads
    labels:
    - runtipi.managed=true
    x-runtipi:
      internal_port: 3000
      is_main: true
  postgres:
    image: postgres:latest
    restart: unless-stopped
    stop_grace_period: 1m
    environment:
      POSTGRES_DB: airtrail
      POSTGRES_USER: airtrail
      POSTGRES_PASSWORD: itworkslocally
      PGDATA: /data/pgdata
    healthcheck:
      test: pg_isready -U airtrail -h localhost -d airtrail
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
    - ${APP_DATA_DIR}/data/db:/data
    labels:
    - runtipi.managed=true
x-runtipi:
  schema_version: 2
