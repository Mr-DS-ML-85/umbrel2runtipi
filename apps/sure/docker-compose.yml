services:
  web:
    image: ghcr.io/we-promise/sure:latest
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/rails:/rails/storage
    restart: on-failure
    environment:
      POSTGRES_USER: sure_user
      POSTGRES_PASSWORD: sure_password
      POSTGRES_DB: sure_production
      SECRET_KEY_BASE: $APP_SEED
      SELF_HOSTED: 'true'
      RAILS_FORCE_SSL: 'false'
      RAILS_ASSUME_SSL: 'false'
      DB_HOST: sure_db_1
      DB_PORT: 5432
      REDIS_URL: redis://sure_redis_1:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    x-runtipi:
      internal_port: 3000
      is_main: true
  worker:
    image: ghcr.io/we-promise/sure:latest
    user: 1000:1000
    command: bundle exec sidekiq
    volumes:
    - ${APP_DATA_DIR}/data/rails:/rails/storage
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POSTGRES_USER: sure_user
      POSTGRES_PASSWORD: sure_password
      POSTGRES_DB: sure_production
      SECRET_KEY_BASE: $APP_SEED
      SELF_HOSTED: 'true'
      RAILS_FORCE_SSL: 'false'
      RAILS_ASSUME_SSL: 'false'
      DB_HOST: sure_db_1
      DB_PORT: 5432
      REDIS_URL: redis://sure_redis_1:6379/1
  db:
    image: postgres:latest
    user: 1000:1000
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data/postgres:/data
    environment:
      POSTGRES_USER: sure_user
      POSTGRES_PASSWORD: sure_password
      POSTGRES_DB: sure_production
      PGDATA: /data/pgdata
    healthcheck:
      test: pg_isready -U sure_user -h localhost -d sure_production
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  redis:
    image: redis:latest
    user: 1000:1000
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data/redis:/data
    healthcheck:
      test: redis-cli ping
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
x-runtipi:
  schema_version: 2
