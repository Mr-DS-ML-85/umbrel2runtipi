services:
  app:
    image: ghcr.io/sheshbabu/zen/zen:latest
    user: 1000:1000
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/app:/data
    - ${APP_DATA_DIR}/data/images:/images
    labels:
    - runtipi.managed=true
    x-runtipi:
      internal_port: 8080
      is_main: true
x-runtipi:
  schema_version: 2
