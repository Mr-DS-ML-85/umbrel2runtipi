services:
  web:
    image: ghcr.io/perber/leafwiki:latest
    restart: on-failure
    environment:
      LEAFWIKI_JWT_SECRET: ${APP_SEED}
      LEAFWIKI_ADMIN_PASSWORD: ${APP_PASSWORD}
      LEAFWIKI_ALLOW_INSECURE: 'true'
    volumes:
    - ${APP_DATA_DIR}/data:/app/data
    x-runtipi:
      internal_port: 8080
      is_main: true
x-runtipi:
  schema_version: 2
