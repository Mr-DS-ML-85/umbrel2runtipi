services:
  web:
    image: corentinth/enclosed:latest
    user: 1000:1000
    restart: unless-stopped
    stop_grace_period: 1m
    volumes:
    - ${APP_DATA_DIR}/data:/app/.data
    labels:
    - runtipi.managed=true
    x-runtipi:
      internal_port: 8787
      is_main: true
x-runtipi:
  schema_version: 2
