services:
  syslog:
    image: linuxserver/syslog-ng:latest
    user: 1000:1000
    restart: unless-stopped
    stop_grace_period: 1m
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=${TZ}
    ports:
    - 514:5514/udp
    - 601:6601/tcp
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${APP_DATA_DIR}/data/logs:/var/log
    healthcheck:
      test:
      - CMD-SHELL
      - test -f /var/log/messages-kv.log || touch /var/log/messages-kv.log
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    labels:
    - runtipi.managed=true
  web:
    image: rickraven/logdy:latest
    user: 1000:1000
    restart: unless-stopped
    environment:
      LOGDY_MODE: follow
      LOGDY_FOLLOW_FILES: /data/*.log
      LOGDY_PASS: ${APP_PASSWORD}
    volumes:
    - ${APP_DATA_DIR}/data/logs:/data:ro
    depends_on:
      syslog:
        condition: service_healthy
    labels:
    - runtipi.managed=true
    x-runtipi:
      internal_port: 8080
      is_main: true
x-runtipi:
  schema_version: 2
