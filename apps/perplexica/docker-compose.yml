services:
  web:
    image: itzcrazykns1337/vane:latest
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/app_data:/home/perplexica/data
    - ${APP_DATA_DIR}/data/uploads:/home/perplexica/uploads
    labels:
    - runtipi.managed=true
    x-runtipi:
      internal_port: 3000
      is_main: true
x-runtipi:
  schema_version: 2
